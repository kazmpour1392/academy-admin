<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت | آکادمی طراحی سایت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  color-scheme: dark;
  --bg:#101426; --card:#1b2340; --text:#f4f5ff;
  --muted:#aeb8d1; --accent:#8172ff; --border:#343e5c;
}
:root.light {
  color-scheme:light;
  --bg:#f2f4fb; --card:#fff; --text:#192039;
  --muted:#65708a; --accent:#6252df; --border:#dce1ef;
}
html{
  width:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
*{box-sizing:border-box}
body{
  margin:0;
  width:100%;
  min-width:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
header{
  padding:18px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}
header > div:last-child{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:21px}
main{width:100%;max-width:1100px;margin:30px auto;padding:0 16px}
.card{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:17px;padding:22px;margin-bottom:18px}
input,button{font:inherit;border-radius:10px;padding:12px;margin:5px 0}
input{width:100%;max-width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:16px}
button{border:0;background:var(--accent);color:white;cursor:pointer;touch-action:manipulation;min-height:44px}
button:disabled{opacity:.6;cursor:wait}
.secondary{background:var(--card);border:1px solid var(--border);color:var(--text)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;align-items:start}
.layout > *{min-width:0}
nav button{display:block;width:100%;text-align:right;margin:7px 0}
.muted{color:var(--muted);font-size:13px;line-height:2}
.hidden{display:none!important}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--border)}
th{color:var(--muted)}
#status{overflow-wrap:anywhere}
@media(max-width:700px){
  header{padding:12px;align-items:flex-start;flex-wrap:wrap}
  header > div:last-child{width:100%;}
  header > div:last-child button{flex:1;}
  h1{font-size:17px}
  main{width:100%;max-width:100%;margin:16px auto;padding:0 10px}
  .layout{grid-template-columns:minmax(0,1fr);gap:12px}
  .card{min-width:0;padding:14px;border-radius:13px}
  input,button{font-size:16px}
  nav button{width:100%;min-height:44px}
  .table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:9px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>آکادمی طراحی سایت</h1>
    <div class="muted">پنل مدیریت مستقل</div>
  </div>
  <div>
    <button class="secondary" id="themeBtn" type="button">🌗 تغییر حالت</button>
    <button id="logoutBtn" class="hidden" type="button">خروج</button>
  </div>
</header>

<main>
  <section id="loginView" class="card">
    <h2>ورود مدیر</h2>
    <p class="muted">با حساب مدیر مجاز وارد شو.</p>
    <form id="loginForm">
      <label for="email">ایمیل</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">رمز عبور</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" type="submit">ورود امن</button>
    </form>
    <p id="status" class="muted" role="status" aria-live="polite"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="card">
      <h2>داشبورد مدیریت</h2>
      <p id="welcome" class="muted"></p>
    </div>
    <div class="layout">
      <nav class="card" aria-label="منوی مدیریت">
        <h3>منوی مدیریت</h3>
        <button type="button" data-page="home">🏠 نمای کلی</button>
        <button type="button" data-page="users">👥 مدیریت کاربران</button>
        <button type="button" data-page="orders">🧾 سفارش‌ها</button>
        <button type="button" data-page="messages">💬 پیام‌ها</button>
        <button type="button" data-page="managers">🛡️ مدیریت مدیران</button>
        <button type="button" data-page="settings">⚙️ تنظیمات</button>
      </nav>
      <section class="card">
        <h2 id="pageTitle">نمای کلی</h2>
        <p id="pageInfo" class="muted">به پنل مدیریت خوش آمدی.</p>
        <div id="usersPanel" class="hidden">
          <input id="userSearch" type="search" placeholder="جست‌وجو بر اساس نام یا ایمیل" aria-label="جست‌وجوی کاربران">
          <button id="refreshUsers" type="button">تازه‌سازی فهرست</button>
          <p id="usersStatus" class="muted" aria-live="polite"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>شناسه</th><th>نام</th><th>ایمیل</th><th>تاریخ ثبت‌نام</th></tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </section>
  <footer class="muted" style="text-align:center;padding:20px">
    سازنده: سید امیر حسین کاظم پور
  </footer>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://pdspayxfazoutbjxqswi.supabase.co";

// فقط کلید عمومی publishable/anon پروژه را قرار بده.
// هرگز service_role یا کلید محرمانه را در کد مرورگر قرار نده.
const SUPABASE_KEY = "sb_publishable_kPYB9r27zwqmJYRDYBMb_A_YR-2a2PX";

const $ = id => document.getElementById(id);
let currentUsers = [];
let loginInProgress = false;

function setStatus(message) {
  $("status").textContent = message;
}

function readableAuthError(error) {
  const message = String(error?.message || "");
  if (/invalid login credentials/i.test(message)) return "ایمیل یا رمز عبور نادرست است.";
  if (/email not confirmed/i.test(message)) return "ایمیل حساب تأیید نشده است.";
  if (/fetch|network/i.test(message)) return "اتصال به Supabase برقرار نشد؛ اینترنت و تنظیمات پروژه را بررسی کن.";
  if (/invalid api key|apikey/i.test(message)) return "کلید عمومی Supabase معتبر نیست؛ کلید درست پروژه را بررسی کن.";
  return message || "ورود ناموفق بود. تنظیمات Supabase را بررسی کن.";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  })[ch]);
}

function formatDate(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "—";
  return date.toLocaleString("fa-IR", {dateStyle:"medium", timeStyle:"short"});
}

let db;
try {
  if (!window.supabase?.createClient) {
    throw new Error("کتابخانه Supabase بارگذاری نشد. اتصال اینترنت را بررسی کن و صفحه را دوباره باز کن.");
  }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (error) {
  console.error(error);
  setStatus(error.message || "راه‌اندازی اتصال Supabase ناموفق بود.");
}

async function verifyAdmin(user) {
  const {data, error} = await db
    .from("admins")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    console.error("verifyAdmin:", error);
    throw new Error("ورود حساب انجام شد، اما بررسی مجوز مدیر ناموفق بود. وجود جدول admins، سیاست‌های RLS و ستون user_id را بررسی کن.");
  }
  if (!data) throw new Error("این حساب در جدول admins به‌عنوان مدیر مجاز ثبت نشده است.");
}

function showApp(user) {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("welcome").textContent = "حساب واردشده: " + (user.email || "مدیر");
}

function showLogin() {
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden");
}

async function login(event) {
  event.preventDefault();
  if (loginInProgress) return;
  if (!db) {
    setStatus("اتصال Supabase آماده نیست. کلید عمومی و بارگذاری کتابخانه را بررسی کن.");
    return;
  }

  loginInProgress = true;
  $("loginBtn").disabled = true;
  setStatus("در حال بررسی اطلاعات ورود...");

  try {
    const {data, error} = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    if (error) throw error;
    if (!data?.user) throw new Error("ورود انجام نشد؛ اطلاعات حساب از Supabase دریافت نشد.");

    try {
      await verifyAdmin(data.user);
      showApp(data.user);
      setStatus("");
    } catch (err) {
      await db.auth.signOut();
      throw err;
    }
  } catch (err) {
    console.error("login:", err);
    setStatus(readableAuthError(err));
  } finally {
    loginInProgress = false;
    $("loginBtn").disabled = false;
  }
}

async function loadUsers() {
  if (!db) {
    $("usersStatus").textContent = "اتصال Supabase آماده نیست.";
    return;
  }
  $("usersStatus").textContent = "در حال دریافت کاربران...";
  $("usersBody").replaceChildren();
  $("refreshUsers").disabled = true;

  try {
    const {data, error} = await db.rpc("admin_registered_users");
    if (error) throw error;
    currentUsers = Array.isArray(data) ? data : [];
    renderUsers();
    $("usersStatus").textContent = "تعداد کاربران دریافت‌شده: " + currentUsers.length;
  } catch (err) {
    console.error("admin_registered_users:", err);
    $("usersStatus").textContent = "خطا در دریافت کاربران: " + (err.message || "خطای نامشخص");
  } finally {
    $("refreshUsers").disabled = false;
  }
}

function renderUsers() {
  const query = $("userSearch").value.trim().toLocaleLowerCase("fa");
  const filtered = currentUsers.filter(user =>
    String(user.full_name || "").toLocaleLowerCase("fa").includes(query) ||
    String(user.email || "").toLocaleLowerCase("fa").includes(query)
  );

  $("usersBody").innerHTML = filtered.map(user => `
    <tr>
      <td>${escapeHTML(user.user_id || "—")}</td>
      <td>${escapeHTML(user.full_name || "بدون نام")}</td>
      <td>${escapeHTML(user.email || "—")}</td>
      <td>${escapeHTML(formatDate(user.created_at))}</td>
    </tr>
  `).join("");

  if (!filtered.length) {
    $("usersBody").innerHTML = '<tr><td colspan="4">کاربری برای نمایش پیدا نشد.</td></tr>';
  }
}

async function navigate(page) {
  const pages = {
    home: ["نمای کلی", "به پنل مدیریت آکادمی طراحی سایت خوش آمدی."],
    users: ["مدیریت کاربران", "فهرست کاربران ثبت‌شده از Supabase."],
    orders: ["سفارش‌ها", "این بخش هنوز به جدول واقعی سفارش‌ها متصل نشده است."],
    messages: ["پیام‌ها", "این بخش هنوز به جدول واقعی پیام‌ها متصل نشده است."],
    managers: ["مدیریت مدیران", "افزودن مدیر باید با کنترل دسترسی سمت پایگاه داده پیاده‌سازی شود."],
    settings: ["تنظیمات", "از دکمه بالای صفحه برای تغییر حالت استفاده کن."]
  };

  const selected = pages[page] || pages.home;
  $("pageTitle").textContent = selected[0];
  $("pageInfo").textContent = selected[1];
  $("usersPanel").classList.toggle("hidden", page !== "users");

  document.querySelectorAll("[data-page]").forEach(button => {
    button.style.opacity = button.dataset.page === page ? "1" : "0.8";
    button.setAttribute("aria-current", button.dataset.page === page ? "page" : "false");
  });

  if (page === "users") await loadUsers();
}

$("loginForm").addEventListener("submit", login);
$("refreshUsers").addEventListener("click", loadUsers);
$("userSearch").addEventListener("input", renderUsers);

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => navigate(button.dataset.page));
});

$("themeBtn").addEventListener("click", () => {
  document.documentElement.classList.toggle("light");
});

$("logoutBtn").addEventListener("click", async () => {
  if (!db) return;
  const {error} = await db.auth.signOut();
  if (error) {
    setStatus("خروج ناموفق بود: " + readableAuthError(error));
    return;
  }
  showLogin();
  setStatus("از حساب خارج شدی.");
});

(async function restoreSession() {
  if (!db) return;
  try {
    const {data, error} = await db.auth.getSession();
    if (error) throw error;
    if (!data.session) return;
    await verifyAdmin(data.session.user);
    showApp(data.session.user);
  } catch (err) {
    console.error("restoreSession:", err);
    await db.auth.signOut();
    showLogin();
    setStatus(err.message || "بازیابی نشست قبلی ناموفق بود.");
  }
})();
</script>
</body>
</html>
